<!-- Exibe enquanto os dados não chegam -->
<div class="container">
    <div *ngIf="!dadosCarregados" style="text-align: center; padding: 20px;">
  Loading...
</div>

<!-- Exibe o gráfico apenas quando dadosCarregados for true -->
<div *ngIf="dadosCarregados" style="width: 100%; max-width: 900px; height: 440px; display: block;">
  <canvas baseChart
    [data]="lineChartData"
    [options]="lineChartOptions"
    [type]="lineChartType">
  </canvas>
</div>
</div>
