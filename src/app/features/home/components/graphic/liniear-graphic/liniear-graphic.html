    <div class="charts-grid">
      @for (chart of ammoCharts; track chart.title; let i = $index) {        
        <div class="chart-card" (click)="openChart(chart)">
          <h3>{{ chart.title }}</h3>
          <div class="canvas-container">
            <canvas baseChart
              [data]="chart.chartData"
              [options]="chart.chartOptions"
              [type]="chart.type">
            </canvas>
          </div>
        </div>     
      }    
    </div>              
  }

<!--GRAPICH MODAL-->
  @if (selectedChart) {
    <div class="modal-overlay" (click)="closeModal()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <button class="close-btn" (click)="closeModal()">&times;</button>
        <h3>{{ selectedChart.title }}</h3>
        <div class="modal-canvas-container">
          <canvas baseChart
            [data]="selectedChart.chartData"
            [options]="selectedChart.chartOptions"
            [type]="selectedChart.type">
          </canvas>
        </div>
      </div>
    </div>
  }
</div>
